# Postgres desechable solo para los tests. Sin contraseña (auth "trust") y
# publicado únicamente en 127.0.0.1: no contiene ningún secreto.
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gtd_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
